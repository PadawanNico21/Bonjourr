<!DOCTYPE html>
<html lang="auto">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bonsoirr</title>
    </head>
    <body>
        <dialog id="bookmarks">
            <div id="bookmarks-container"></div>
            <hr />
            <div id="bookmarks-buttons">
                <button id="bmk_close" class="btn-red" data-translate>
                    Cancel
                </button>
                <button id="bmk_apply" class="none" data-translate>
                    Select bookmarks
                </button>
            </div>
        </dialog>

        <dialog id="editlink">
            <form id="editlink-form">
                <label id="ei_title" autofocus>
                    <span data-translate>Title</span>
                    <input
                        id="e_title"
                        type="text"
                        name="e_title"
                        maxlength="64"
                        autocomplete="off"
                        placeholder="Example"
                        data-translate-placeholder
                    />
                </label>

                <label id="ei_url">
                    <span data-translate>Link</span>
                    <input
                        id="e_url"
                        type="text"
                        name="e_url"
                        maxlength="512"
                        autocomplete="off"
                        placeholder="https://example.com"
                    />
                </label>

                <label id="ei_icon">
                    <span data-translate>Icon</span>
                    <input
                        id="e_iconurl"
                        type="url"
                        name="e_iconurl"
                        maxlength="7600"
                        autocomplete="off"
                        placeholder="https://example.com/favicon.ico"
                    />
                </label>

                <hr />

                <button type="submit" data-translate id="eb_inputs">
                    Submit from inputs
                </button>
                <button type="submit" data-translate id="eb_add-tab">
                    Add new page
                </button>
                <button type="submit" data-translate id="eb_add-link">
                    Add new link
                </button>
                <button type="submit" data-translate id="eb_add-folder">
                    Create new folder
                </button>
                <button
                    type="submit"
                    class="btn-red"
                    id="eb_delete-tab"
                    data-translate
                >
                    Delete page
                </button>
                <button
                    type="submit"
                    class="btn-red"
                    id="eb_delete-selected"
                    data-translate
                >
                    Delete selection
                </button>
                <button
                    type="submit"
                    class="btn-red"
                    id="eb_delete-folder"
                    data-translate
                >
                    Delete folder
                </button>
                <button
                    type="submit"
                    class="btn-red"
                    id="eb_delete-link"
                    data-translate
                >
                    Delete link
                </button>
                <button type="submit" data-translate id="eb_remove-folder">
                    Remove from folder
                </button>
                <button type="submit" data-translate id="eb_submit-changes">
                    Apply changes
                </button>
            </form>
        </dialog>

        <dialog id="element-mover" class="hidden">
            <div id="grid-selection">
                <p data-translate>Editing</p>
                <h3 id="mover-title" data-translate>No selection</h3>
            </div>

            <div>
                <p data-translate>Grid position</p>
                <div id="grid-mover" class="mover">
                    <button type="button" data-row="-1">
                        <i class="chevron rotate-half"></i>
                    </button>
                    <div>
                        <button type="button" data-col="-1">
                            <i class="chevron rotate-quart"></i>
                        </button>
                        <button type="button" data-col="1">
                            <i class="chevron rotate-quart-r"></i>
                        </button>
                    </div>
                    <button type="button" data-row="1">
                        <i class="chevron"></i>
                    </button>
                </div>
            </div>
            <div id="grid-spanner-container">
                <button class="grid-spanner" id="grid-span-rows" data-translate>
                    Fill row
                </button>
                <button class="grid-spanner" id="grid-span-cols" data-translate>
                    Fill column
                </button>
            </div>
            <div>
                <p data-translate>Box alignment</p>
                <div id="box-alignment-mover" class="mover">
                    <button type="button" data-align="baseline baseline">
                        <i class="box-corner"></i>
                    </button>
                    <button type="button" data-align="baseline center">
                        <i class="box-side rotate-half"></i>
                    </button>
                    <button type="button" data-align="baseline end">
                        <i class="box-corner rotate-quart"></i>
                    </button>
                    <button type="button" data-align="center baseline">
                        <i class="box-side rotate-quart"></i>
                    </button>
                    <button type="button" data-align="">
                        <i class="box-center"></i>
                    </button>
                    <button type="button" data-align="center end">
                        <i class="box-side rotate-quart-r"></i>
                    </button>
                    <button type="button" data-align="end baseline">
                        <i class="box-corner rotate-quart-r"></i>
                    </button>
                    <button type="button" data-align="end center">
                        <i class="box-side"></i>
                    </button>
                    <button type="button" data-align="end end">
                        <i class="box-corner rotate-half"></i>
                    </button>
                </div>
            </div>
            <div>
                <p data-translate>Text alignment</p>
                <div id="text-alignment-mover" class="mover">
                    <button data-align="left">
                        <i class="text-left"></i>
                    </button>
                    <button data-align="">
                        <i class="text-center"></i>
                    </button>
                    <button data-align="right">
                        <i class="text-right"></i>
                    </button>
                </div>
            </div>

            <div id="close-mover-wrapper">
                <hr />

                <button id="b_resetlayout" class="btn-red" data-translate>
                    Reset layout
                </button>
                <button id="close-mover" data-translate>Done</button>
            </div>
        </dialog>

        <div id="background_overlay">
            <div id="background"></div>
            <div id="background-bis"></div>
        </div>

        <main id="interface">
            <div id="time">
                <div id="time-container" data-hide="clock">
                    <h1 id="digital">
                        <span id="digital-hh-leading-zero">0</span
                        ><span id="digital-hh"></span
                        ><span id="digital-hh-separator">:</span
                        ><span id="digital-mm"></span
                        ><span id="digital-mm-separator">:</span
                        ><span id="digital-ss"></span
                        ><span id="digital-am-pm"></span>
                    </h1>

                    <div id="analog">
                        <div id="analog-face">
                            <span>12</span>
                            <span>3</span>
                            <span>6</span>
                            <span>9</span>
                        </div>

                        <div id="analog-center"></div>
                        <span id="analog-hours"></span>
                        <span id="analog-minutes"></span>
                        <span id="analog-seconds"></span>
                    </div>
                </div>

                <p id="date" data-hide="date">
                    <span id="date-aa"></span
                    ><span id="date-aa-separator"></span
                    ><span id="date-bb"></span
                    ><span id="date-bb-separator"></span
                    ><span id="date-cc"></span>
                </p>
            </div>

            <div id="main" class="hidden">
                <h2 id="greetings" data-hide="greetings">
                    <span id="greeting"></span>
                    <span id="greeting-name"></span>
                </h2>

                <a id="weather" class="wait" rel="noreferrer">
                    <div id="description" data-hide="weatherdesc">
                        <p id="current">meteo</p>
                        <p id="forecast">forecast</p>
                    </div>

                    <div id="tempContainer" data-hide="weathericon">
                        <img
                            id="weather-icon"
                            alt=""
                            draggable="false"
                            fetchpriority="high"
                        />
                        <p>00</p>
                    </div>
                </a>
            </div>

            <div id="notes_container" class="hidden"></div>

            <form id="sb_container" class="hidden">
                <div id="searchbar-wrapper">
                    <input
                        id="searchbar"
                        type="text"
                        name="searchbar"
                        autocomplete="off"
                        spellcheck="false"
                        aria-label="Search bar"
                    />

                    <div id="sb-buttons">
                        <button
                            id="sb_empty"
                            aria-label="Empty search"
                            type="button"
                            disabled
                        >
                            ✕
                        </button>

                        <hr />

                        <button
                            id="sb_submit"
                            aria-label="Submit search"
                            type="submit"
                            disabled
                        >
                            <img
                                src="/assets/svgs/search.svg"
                                class="default-search-icon"
                                draggable="false"
                                alt=""
                            />
                        </button>
                    </div>
                </div>

                <ul id="sb-suggestions"></ul>
            </form>

            <div id="linkblocks">
                <ul id="link-list"></ul>

                <div id="link-title">
                    <div id="folder-title">
                        <button class="selected" data-translate>Folder</button>
                    </div>

                    <div id="tab-title">
                        <button id="default-tab-title" data-translate>
                            Default page
                        </button>
                    </div>
                </div>
            </div>

            <div id="quotes_container" class="hidden">
                <p id="quote"></p>
                <p id="author"></p>
            </div>
        </main>

        <div id="creditContainer">
            <div id="credit"></div>
        </div>

        <div id="showSettings" data-hide="settingsicon">
            <button aria-label="Toggle settings menu">
                <img
                    src="/assets/svgs/settings.svg"
                    alt="Settings"
                    draggable="false"
                />
            </button>
        </div>

        <input
            type="text"
            data-translate-placeholder
            placeholder="Default page"
        />
    </body>
</html>
